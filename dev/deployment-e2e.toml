provider               = "proxmox"
proxmox_node           = "server"
snapshot               = "wr-e2e-v1"
expected_image_version = "wr-e2e-v1"
lock_file              = "/var/lock/wruntime-deployment-e2e.lock"
workdir                = "/opt/wruntime"
node_id                = "wr-e2e-node"

[manager]
vmid     = 120
name     = "wr-e2e-manager"
host     = "192.168.178.77"
ssh_user = "deploy"
role     = "manager"

# Manager B is a protected-runner-owned disposable target. Its VMID, reachable
# literal IP, and baseline snapshot are supplied through
# WRT_DEPLOY_E2E_MANAGER_B_{VMID,IP,SNAPSHOT}; they are deliberately not
# repository infrastructure coordinates.
[manager_b]
name     = "wr-e2e-manager-b"
ssh_user = "deploy"
role     = "manager-b"

[node]
vmid     = 121
name     = "wr-e2e-node"
host     = "192.168.178.78"
ssh_user = "deploy"
role     = "node"
