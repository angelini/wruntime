# TYPE  DATABASE  USER                       ADDRESS         METHOD
local   all       postgres                                   peer
# Disposable migration executors authenticate only over the co-located tool socket.
local   all       +wr__migration_executor_auth               scram-sha-256
# Bounded tenant logins always hit native certificate mapping first.
hostssl all       +wr__tenant_client_auth    127.0.0.1/32    cert map=wruntime_nodes clientcert=verify-full
hostssl all       +wr__tenant_client_auth    172.16.0.0/12   cert map=wruntime_nodes clientcert=verify-full
# Explicit platform/admin password path; tenant roles have no password fallback.
host    all       postgres                   127.0.0.1/32    scram-sha-256
host    all       postgres                   172.16.0.0/12   scram-sha-256
host    all       all                        127.0.0.1/32    scram-sha-256
host    all       all                        172.16.0.0/12   scram-sha-256
host    all       all                        0.0.0.0/0       reject
host    all       all                        ::/0            reject
