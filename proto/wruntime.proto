message NodeAgentAttestation {
  string node_id = 1;
  string agent_instance_id = 2;
  string protocol_version = 3;
  string binary_digest = 4;
  reserved 5, 10;
  reserved "config_digest", "retention_count";
  BackendKind backend = 6;
  repeated string capabilities = 7;
  optional google.protobuf.Timestamp observed_at = 8;
  string authenticated_principal = 9;
}
// Narrow compatibility expectation. retention_count is operator-owned cleanup
// policy, not attestation evidence or a claim-eligibility input. Omission on an
// update preserves the stored value; initial creation requires it.
message NodeAgentPolicy {
  string node_id = 1;
  string protocol_version = 2;
  reserved 3, 6, 8 to 18;
  reserved "config_digest", "policy_version", "manager_endpoint", "client_cert_path", "client_key_path", "ca_cert_path", "deployment_root", "runtime_dir", "compose_project", "systemctl_path", "docker_path", "poll_interval_seconds", "renew_interval_seconds";
  BackendKind backend = 4;
  optional uint32 retention_count = 5;
  string binary_digest = 7;
  repeated string capabilities = 19;
}
message PutNodeAgentPolicyRequest { NodeAgentPolicy policy = 1; }
message PutNodeAgentPolicyResponse { NodeAgentPolicy policy = 1; }
