  rpc ClaimOperation(ClaimOperationRequest) returns (ClaimOperationResponse);
  rpc RenewOperationLease(RenewOperationLeaseRequest) returns (RenewOperationLeaseResponse);
  rpc ClaimNodeCleanup(ClaimNodeCleanupRequest) returns (ClaimNodeCleanupResponse);
  rpc RenewNodeCleanupLease(RenewNodeCleanupLeaseRequest) returns (RenewNodeCleanupLeaseResponse);
  rpc ReportNodeCleanupResult(ReportNodeCleanupResultRequest) returns (ReportNodeCleanupResultResponse);
  rpc ReportObservation(ReportNodeObservationRequest) returns (ReportNodeObservationResponse);
  rpc ReportStepResult(ReportStepResultRequest) returns (ReportStepResultResponse);
}

service PolicyService {
  rpc GetPolicyStatus(GetPolicyStatusRequest) returns (GetPolicyStatusResponse);
  rpc GetWorkloadSnapshot(GetWorkloadSnapshotRequest) returns (GetWorkloadSnapshotResponse);
}
