syntax = "proto3";
package wruntime;

import "google/protobuf/timestamp.proto";

// ── Shared messages ───────────────────────────────────────────────────────

// Process lifecycle is a monotonic stage, not an availability or health
// severity. STATUS_SEVERITY_* remains the cluster-health evidence contract.
enum ProcessLifecycleState {
  PROCESS_LIFECYCLE_STATE_UNSPECIFIED = 0; // invalid or unknown wire input only
  PROCESS_LIFECYCLE_STATE_STARTING = 1;
  // The owning service crossed its startup barriers and admits intended work;
  // dependency and routing health remain separate StatusSeverity evidence.
  PROCESS_LIFECYCLE_STATE_READY = 2;
  // Graceful shutdown is in progress. Service-specific phases remain internal;
  // no STOPPED state is remotely observable after the endpoint is gone.
  PROCESS_LIFECYCLE_STATE_STOPPING = 3;
}

// Stable process role. A process instance reports exactly one non-unspecified
// kind for its lifetime.
enum ServiceKind {
  SERVICE_KIND_UNSPECIFIED = 0;
  SERVICE_KIND_MANAGER = 1;
  SERVICE_KIND_PROXY = 2;
  SERVICE_KIND_ENGINE = 3;
}

// Stable automation keys for the most recent lifecycle transition. `detail`
// on LifecycleStatus is explanatory text and must not be parsed by automation.
enum LifecycleTransitionReason {
  LIFECYCLE_TRANSITION_REASON_UNSPECIFIED = 0;
  LIFECYCLE_TRANSITION_REASON_PROCESS_STARTED = 1;
  LIFECYCLE_TRANSITION_REASON_STARTUP_COMPLETE = 2;
  LIFECYCLE_TRANSITION_REASON_SIGNAL_INTERRUPT = 3;
  LIFECYCLE_TRANSITION_REASON_SIGNAL_TERMINATE = 4;
  LIFECYCLE_TRANSITION_REASON_SHUTDOWN_ORCHESTRATION = 5;
  LIFECYCLE_TRANSITION_REASON_TASK_FAILURE = 6;
}

enum PrivilegedAdmissionState {
  PRIVILEGED_ADMISSION_STATE_UNSPECIFIED = 0;
  PRIVILEGED_ADMISSION_STATE_OPEN = 1;
  PRIVILEGED_ADMISSION_STATE_CLOSED_STARTUP = 2;
  PRIVILEGED_ADMISSION_STATE_CLOSED_ROLLOUT = 3;
  PRIVILEGED_ADMISSION_STATE_CLOSED_MISMATCH = 4;
}

message LifecycleStatus {
  ProcessLifecycleState state = 1;
  ServiceKind service_kind = 2;
  string process_instance_id = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  LifecycleTransitionReason reason = 5;
  string detail = 6; // bounded explanatory text; never an automation key
  string manager_id = 7;
  bool process_ready = 8;
  uint64 policy_generation = 9;
  string policy_digest = 10;
  PrivilegedAdmissionState privileged_admission = 11;
  string rollout_operation_id = 12;
  ManagerRolloutPhase rollout_phase = 13;
  string rollout_expected_set_hash = 14;
  uint64 last_observed_rollout_lease_epoch = 15;
}

message GetLifecycleStatusRequest {}
message GetLifecycleStatusResponse { LifecycleStatus status = 1; }

// Read-only semantic process observation. Process owners initiate graceful
// shutdown exclusively with operating-system signals, never lifecycle RPCs.
service LifecycleService {
  rpc GetStatus(GetLifecycleStatusRequest) returns (GetLifecycleStatusResponse);
}

message ModuleDescriptor {
  string name         = 1;
  string version      = 2;
  bytes  proto_schema = 3; // serialised FileDescriptorSet for this module's API
  string namespace    = 4; // mandatory — e.g. "payments"
}

message EngineRegistration {
  string                    engine_id     = 1;
  string                    address       = 2; // HTTP URL the local proxy uses to reach this engine
  repeated ModuleDescriptor modules       = 3;
  string                    proxy_address = 4; // local proxy URL used by this engine
  repeated SecretRequest    secrets       = 5; // secrets this engine needs (resolved from config)
  string                    peer_address  = 6; // mTLS peer address (https://host:peer_port)
  repeated string           db_namespaces = 7; // namespaces that need DB access
  DeploymentMetadata        deployment    = 8; // stable desired-deployment identity
  string                    job_queue_id  = 9; // explicit identity of the physical wr__jobs database
  string                    job_admin_address = 10; // mTLS EngineJobAdminService HTTPS address
}

// Stable metadata supplied by a revision-specific engine configuration. engine_id
// remains a process identity; node_id/revision/slot identify the desired deployment.
message DeploymentMetadata {
  string node_id = 1;
  uint64 revision = 2;
  string bundle_digest = 3; // sha256:<lowercase hex>
  string engine_slot = 4;
  string operation_id = 5; // manager-created deployment operation UUID
  string revision_digest = 6; // manager-derived canonical revision digest
}

message ModuleIdentity {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message ExpectedModule {
  ModuleIdentity identity = 1;
  string proto_schema_digest = 2; // empty when no schema is declared
}

message ExpectedEngine {
  string engine_slot = 1;
  repeated ExpectedModule modules = 2;
  repeated SecretRequest secrets = 3;
  repeated string db_namespaces = 4;
  string job_queue_id = 5;
  string job_admin_address = 6;
}

message DeploymentInventoryV1 {
  uint32 schema_version = 1;
  repeated ExpectedEngine engines = 2;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_PENDING = 1;
  DEPLOYMENT_STATE_ACTIVE = 2;
  DEPLOYMENT_STATE_SUCCEEDED = 3;
  DEPLOYMENT_STATE_FAILED = 4;
}

message DeploymentCondition {
  string code = 1; // stable machine-readable reason code
  string detail = 2; // human-readable evidence; automation must use code/severity
  StatusSeverity severity = 3;
  string affected_identity = 4;
  string desired = 5;
  string actual = 6;
}

message DeploymentRecord {
  string node_id = 1;
  uint64 revision = 2;
  string attempt_token = 3;
  string bundle_digest = 4;
  DeploymentInventoryV1 inventory = 5;
  DeploymentState state = 6;
  optional google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  string failure_detail = 9;
  uint64 source_revision = 10; // non-zero when this attempt rolls back a prior snapshot
  optional google.protobuf.Timestamp activated_at = 11;
  string resolved_release_digest = 12; // immutable finalized post-template release identity
  optional google.protobuf.Timestamp finalized_at = 13;
  uint32 inventory_schema_version = 14;
  string revision_digest = 15;
  string operation_id = 16; // manager-derived UUID reserved for this deployment revision
}

message BeginDeploymentRequest {
  string node_id = 1;
  string attempt_token = 2;
  string bundle_digest = 3;
  DeploymentInventoryV1 inventory = 4;
}
message BeginDeploymentResponse { DeploymentRecord deployment = 1; }
message FinalizeDeploymentRequest {
  string node_id = 1;
  string attempt_token = 2;
  uint64 revision = 3;
  string bundle_digest = 4;
  string resolved_release_digest = 5;
}
message FinalizeDeploymentResponse { DeploymentRecord deployment = 1; }
message AbandonDeploymentRequest {
  string node_id = 1;
  string attempt_token = 2;
}
message AbandonDeploymentResponse {
  bool abandoned = 1;
  DeploymentRecord deployment = 2;
}

message VerifyDeploymentRequest { string node_id = 1; uint64 revision = 2; }
message VerifyDeploymentResponse {
  DeploymentRecord deployment = 1;
  bool ready = 2;
  repeated DeploymentCondition conditions = 3;
}

message BeginRollbackRequest {
  string node_id = 1;
  uint64 to_revision = 2; // zero selects the previous successful revision
  string attempt_token = 3;
}
message BeginRollbackResponse { DeploymentRecord deployment = 1; }

message RoutingRule {
  string rule_id                   = 1;
  string source_module             = 2; // metadata reserved for future source policy; ignored by routing
  string destination_module        = 3;
  string engine_id                 = 4;
  string engine_address            = 5;
  string destination_version       = 6; // semver string, e.g. "1.2.0"
  bool   healthy                   = 7; // set by manager; false means no traffic
  string source_namespace          = 8; // metadata reserved for future source policy; ignored by routing
  string destination_namespace     = 9;
  reserved 10;
  reserved "proxy_address";
  string peer_address              = 11; // sole cross-node forwarding address (required, non-empty)
}

message RoutingTable {
  repeated RoutingRule rules   = 1;
  uint64               version = 2; // incremented on every write
}

// ── Engine lifecycle ──────────────────────────────────────────────────────

message EngineOwnershipFence {
  string node_id = 1;
  string slot = 2;
  string revision_digest = 3;
  string activation_id = 4;
  uint64 slot_generation = 5;
}

message RegisterEngineRequest {
  EngineRegistration registration = 1;
  string activation_id = 2; // process-generated UUID; never persisted in prelaunch config
}
message RegisterEngineResponse   {
  bool                              accepted       = 1;
  repeated NamespaceSecrets         secrets        = 2; // only the requested secrets, decrypted
  repeated NamespaceDbCredential    db_credentials = 3; // per-namespace DB role + password
  EngineOwnershipFence              fence          = 4;
  bytes serialized_snapshot                        = 5;
}
message DeregisterEngineRequest  { string engine_id = 1; EngineOwnershipFence fence = 2; }
message DeregisterEngineResponse { EngineOwnershipFence accepted_fence = 1; }
message HeartbeatRequest {
  string                    engine_id       = 1;
  repeated ModuleDescriptor healthy_modules = 2; // modules the engine considers healthy
  EngineOwnershipFence      fence = 3;
}
// A manager reply reports the routing-table version produced by readiness
// publication. A NodeService reply additionally reports the local proxy version
// installed before it replies. Zero means no convergence evidence was produced.
message HeartbeatResponse {
  uint64 manager_routing_table_version = 1;
  uint64 proxy_routing_table_version = 2;
  EngineOwnershipFence accepted_fence = 3;
  bytes serialized_snapshot = 4;
}

// Begin drain withdraws route admission but intentionally retains the final
// engine registration. It is idempotent and returns the same convergence
// evidence as HeartbeatResponse.
message BeginEngineDrainRequest { string engine_id = 1; EngineOwnershipFence fence = 2; }
message BeginEngineDrainResponse {
  uint64 manager_routing_table_version = 1;
  uint64 proxy_routing_table_version = 2;
  EngineOwnershipFence accepted_fence = 3;
}
message ListEnginesRequest       {}
message ListEnginesResponse      { repeated EngineRegistration engines = 1; }

// ── Routing table ─────────────────────────────────────────────────────────

message GetRoutingTableRequest    {
  uint64 known_version = 1; // if set and matches current version, server returns no table
}
message GetRoutingTableResponse   { RoutingTable table = 1; }
message UpsertRoutingRuleResponse {}
message DeleteRoutingRuleRequest  { string rule_id = 1; }
message DeleteRoutingRuleResponse {}

// ── Database credentials ──────────────────────────────────────────────────

message NamespaceDbCredential {
  string namespace = 1;
  string role      = 2;  // e.g. "wr_ns_ecommerce"
  string password  = 3;
}

// ── Secrets ───────────────────────────────────────────────────────────────

message SecretRequest {
  string namespace = 1;
  string key       = 2;
}

message NamespaceSecrets {
  string              namespace = 1;
  map<string, string> secrets   = 2; // key → plaintext value
}

message SetSecretRequest    { string namespace = 1; string key = 2; string value = 3; }
message SetSecretResponse   {}
message DeleteSecretRequest { string namespace = 1; string key = 2; }
message DeleteSecretResponse{}
message ListSecretsRequest  { string namespace = 1; } // empty = all namespaces
message SecretEntry         { string namespace = 1; string key = 2; }
message ListSecretsResponse { repeated SecretEntry secrets = 1; }

// ── Manager discovery ─────────────────────────────────────────────────────

message ListManagersRequest {}
message ManagerInfo {
  reserved 3;
  reserved "gossip_address";
  string manager_id = 1;
  string grpc_address = 2;
}
message ListManagersResponse { repeated ManagerInfo managers = 1; }

// ── Explainable cluster status ────────────────────────────────────────────

// Numeric ordering is deliberate for deterministic reduction. UNKNOWN is a
// separate evidence state and is ignored when reducing supported signals.
enum StatusSeverity {
  STATUS_SEVERITY_UNKNOWN = 0;
  STATUS_SEVERITY_HEALTHY = 1;
  STATUS_SEVERITY_DEGRADED = 2;
  STATUS_SEVERITY_UNHEALTHY = 3;
}

enum ManagerMembershipState {
  MANAGER_MEMBERSHIP_STATE_UNKNOWN = 0;
  MANAGER_MEMBERSHIP_STATE_LIVE = 1;
  MANAGER_MEMBERSHIP_STATE_DEAD = 2;
}

message ManagerStatus {
  reserved 3;
  reserved "gossip_address";
  string manager_id = 1;
  string grpc_address = 2;
  StatusSeverity severity = 4;
  ManagerMembershipState membership = 5;
  optional google.protobuf.Timestamp registered_at = 6;
  optional google.protobuf.Timestamp last_heartbeat = 7;
  uint64 heartbeat_age_seconds = 8;
  repeated DeploymentCondition conditions = 9;
}

message ModuleStatus {
  ModuleIdentity module = 1;
  StatusSeverity severity = 2;
  optional google.protobuf.Timestamp last_healthy = 3;
  uint64 heartbeat_age_seconds = 4;
  repeated DeploymentCondition conditions = 5;
}

message EngineStatus {
  string engine_id = 1;
  string address = 2;
  DeploymentMetadata deployment = 3;
  StatusSeverity severity = 4;
  bool authoritative_for_desired_revision = 5;
  optional google.protobuf.Timestamp registered_at = 6;
  optional google.protobuf.Timestamp last_heartbeat = 7;
  uint64 heartbeat_age_seconds = 8;
  repeated ModuleStatus modules = 9;
  repeated DeploymentCondition conditions = 10;
  NodeCleanupSummary release_cleanup = 11;
}

message RouteStatus {
  RoutingRule rule = 1;
  StatusSeverity severity = 2;
  bool desired = 3;
  optional google.protobuf.Timestamp updated_at = 4;
  repeated DeploymentCondition conditions = 5;
}

message ServiceStatus {
  ModuleIdentity service = 1;
  StatusSeverity severity = 2;
  uint32 desired_routes = 3;
  uint32 healthy_routes = 4;
  uint32 unhealthy_routes = 5;
  repeated RouteStatus routes = 6;
  repeated DeploymentCondition conditions = 7;
}

// Immutable, non-circular identity embedded in a managed proxy deployment.
// The complete message is absent for unmanaged local development.
message ProxyDeploymentMetadata {
  string node_id = 1;
  uint64 revision = 2;
  string bundle_digest = 3;
  string operation_id = 4;
  string revision_digest = 5;
}

enum ProxyListenerKind {
  PROXY_LISTENER_KIND_UNSPECIFIED = 0;
  PROXY_LISTENER_KIND_DATA_PLANE = 1;
  PROXY_LISTENER_KIND_NODE_CONTROL = 2;
  PROXY_LISTENER_KIND_PEER = 3;
  PROXY_LISTENER_KIND_EXTERNAL = 4;
}

message ProxyListenerEvidence {
  ProxyListenerKind kind = 1;
  bool configured = 2;
  bool accepting = 3;
}

enum ProxyBreakerDestinationKind {
  PROXY_BREAKER_DESTINATION_KIND_UNSPECIFIED = 0;
  PROXY_BREAKER_DESTINATION_KIND_LOCAL_ENGINE = 1;
  PROXY_BREAKER_DESTINATION_KIND_PEER_PROXY = 2;
}

// Aggregate-only breaker evidence. Concrete endpoint addresses are deliberately
// not stable inventory identity and are not reported.
message ProxyBreakerEvidence {
  ProxyBreakerDestinationKind destination_kind = 1;
  uint32 total = 2;
  uint32 closed = 3;
  uint32 open = 4;
  uint32 half_open = 5;
}

// One bounded, complete replacement report for a registered proxy process.
message ProxyInventoryReport {
  ProcessLifecycleState lifecycle_state = 1;
  bool admission_open = 2;
  repeated ProxyListenerEvidence listeners = 3;
  uint64 installed_routing_table_version = 4;
  uint64 routing_observation_age_millis = 5;
  string routing_manager_id = 6;
  bool routing_synchronized = 7;
  repeated ProxyBreakerEvidence breakers = 8;
}

message RegisterProxyRequest {
  string process_instance_id = 1;
  ProxyDeploymentMetadata deployment = 2;
}
message RegisterProxyResponse { bool accepted = 1; }
message ReportProxyInventoryRequest {
  string process_instance_id = 1;
  ProxyInventoryReport report = 2;
}
message ReportProxyInventoryResponse {
  bool accepted = 1;
  google.protobuf.Timestamp received_at = 2;
  string receiving_manager_id = 3;
}
message DeregisterProxyRequest { string process_instance_id = 1; }
message DeregisterProxyResponse { bool accepted = 1; }

// Manager-observed inventory row. proxy_id and node_id are derived from the
// enrolled URI-SAN principal and its policy binding, never from report payload.
message ProxyListenerStatus {
  ProxyListenerKind kind = 1;
  bool configured = 2;
  bool accepting = 3;
  StatusSeverity severity = 4;
  repeated DeploymentCondition conditions = 5;
}

message ProxyRoutingStatus {
  uint64 installed_table_version = 1;
  uint64 synchronization_age_seconds = 2;
  string source_manager_id = 3;
  bool synchronized = 4;
  StatusSeverity severity = 5;
  repeated DeploymentCondition conditions = 6;
}

message ProxyBreakerStatus {
  ProxyBreakerDestinationKind destination_kind = 1;
  uint32 total = 2;
  uint32 closed = 3;
  uint32 open = 4;
  uint32 half_open = 5;
  StatusSeverity severity = 6;
  repeated DeploymentCondition conditions = 7;
}

message ProxyInventoryStatus {
  string proxy_id = 1;
  string node_id = 2;
  string process_instance_id = 3;
  ProxyDeploymentMetadata deployment = 4;
  ProxyInventoryReport report = 5;
  google.protobuf.Timestamp registered_at = 6;
  google.protobuf.Timestamp report_received_at = 7;
  string receiving_manager_id = 8;
  StatusSeverity severity = 9;
  bool expected = 10;
  bool selected = 11;
  bool superseded = 12;
  uint64 report_age_seconds = 13;
  repeated ProxyListenerStatus listeners = 14;
  ProxyRoutingStatus routing = 15;
  repeated ProxyBreakerStatus breakers = 16;
  repeated DeploymentCondition conditions = 17;
}

message NodeStatus {
  string node_id = 1;
  StatusSeverity severity = 2;
  DeploymentRecord desired_deployment = 3; // committed serving deployment
  repeated DeploymentRecord deployment_history = 4;
  repeated EngineStatus engines = 5;
  repeated DeploymentCondition conditions = 6;
  DeploymentRecord target_deployment = 7; // optional staged deployment
  NodeCleanupSummary release_cleanup = 8;
  repeated ProxyInventoryStatus proxies = 9;
}

message GetClusterStatusRequest {}
message GetClusterStatusResponse {
  reserved 3;
  reserved "gossip_observed_at";
  optional google.protobuf.Timestamp response_at = 1;
  optional google.protobuf.Timestamp database_observed_at = 2;
  uint64 routing_table_version = 4;
  StatusSeverity severity = 5;
  repeated ManagerStatus managers = 6;
  repeated NodeStatus nodes = 7;
  repeated EngineStatus engines = 8; // includes managed and unmanaged registrations
  repeated ServiceStatus services = 9;
  repeated DeploymentCondition conditions = 10; // cluster-wide/unsupported signals
  repeated ProxyInventoryStatus proxies = 11; // managed and unmanaged active processes
}

// ── Durable operator lifecycle operations (manager-owned) ────────────────

// Operator actions are durable deployment/node intent. They never identify a
// PID and never mutate LifecycleService directly.
enum NodeOperationAction {
  reserved 1, 2, 4, 5;
  reserved "NODE_OPERATION_ACTION_INITIAL_APPLY", "NODE_OPERATION_ACTION_DRAIN", "NODE_OPERATION_ACTION_ROLLING_UPGRADE", "NODE_OPERATION_ACTION_SCALE";
  NODE_OPERATION_ACTION_UNSPECIFIED = 0;
  NODE_OPERATION_ACTION_RESTART = 3;
  NODE_OPERATION_ACTION_ROLLBACK = 6;
  NODE_OPERATION_ACTION_DEPLOYMENT = 7;
}

enum NodeOperationState {
  NODE_OPERATION_STATE_UNSPECIFIED = 0;
  NODE_OPERATION_STATE_QUEUED = 1;
  NODE_OPERATION_STATE_RUNNING = 2;
  NODE_OPERATION_STATE_PAUSED = 3;
  NODE_OPERATION_STATE_SUCCEEDED = 4;
  NODE_OPERATION_STATE_FAILED = 5;
  NODE_OPERATION_STATE_CANCELLED = 6;
}

enum NodeCleanupState {
  NODE_CLEANUP_STATE_UNSPECIFIED = 0;
  NODE_CLEANUP_STATE_CLEAN = 1;
  NODE_CLEANUP_STATE_NEEDS_RECONCILE = 2;
  NODE_CLEANUP_STATE_PENDING = 3;
  NODE_CLEANUP_STATE_CLAIMED = 4;
  NODE_CLEANUP_STATE_PAUSED = 5;
}

enum NodeCleanupResultDisposition {
  NODE_CLEANUP_RESULT_DISPOSITION_UNSPECIFIED = 0;
  NODE_CLEANUP_RESULT_DISPOSITION_ACCEPTED = 1;
  NODE_CLEANUP_RESULT_DISPOSITION_SUPERSEDED = 2;
}

message NodeCleanupSummary {
  string node_id = 1;
  NodeCleanupState state = 2;
  uint64 generation = 3;
  uint32 candidate_count = 4;
  optional google.protobuf.Timestamp last_reconciled_at = 5;
  optional google.protobuf.Timestamp next_action_at = 6;
  uint32 inventory_count = 7;
  string diagnostic_code = 8;
  string diagnostic_detail = 9;
}

// Operation phase is intentionally separate from terminal/lease state.
// Restoration is deadline-free but lease-fenced; release cleanup is a separate lifecycle.
enum NodeOperationPhase {
  reserved 4, 6;
  reserved "NODE_OPERATION_PHASE_COMMITTED_CLEANUP", "NODE_OPERATION_PHASE_SUPERSEDED";
  NODE_OPERATION_PHASE_UNSPECIFIED = 0;
  NODE_OPERATION_PHASE_FORWARD = 1;
  NODE_OPERATION_PHASE_RESTORING_SOURCE = 2;
  NODE_OPERATION_PHASE_COMMITTING = 3;
  NODE_OPERATION_PHASE_COMPLETE = 5;
}

enum NodeOperationStepKind {
  NODE_OPERATION_STEP_KIND_UNSPECIFIED = 0;
  NODE_OPERATION_STEP_KIND_VERIFY_RELEASE_METADATA = 1;
  NODE_OPERATION_STEP_KIND_VERIFY_PROXY = 2;
  NODE_OPERATION_STEP_KIND_STOP_BACKEND = 3;
  NODE_OPERATION_STEP_KIND_SELECT_RELEASE = 4;
  NODE_OPERATION_STEP_KIND_START_BACKEND = 5;
  NODE_OPERATION_STEP_KIND_VERIFY_TARGET = 6;
  NODE_OPERATION_STEP_KIND_SWITCH_AUTHORITY = 7;
  NODE_OPERATION_STEP_KIND_VERIFY_SERVING = 8;
  NODE_OPERATION_STEP_KIND_RESTORE_SOURCE = 9;
  reserved 10;
  reserved "NODE_OPERATION_STEP_KIND_CLEANUP_RELEASE";
  // Read-only backend inspection after takeover or ambiguous effect delivery.
  NODE_OPERATION_STEP_KIND_INSPECT_BACKEND = 11;
}

enum NodeSlotTransitionKind {
  NODE_SLOT_TRANSITION_KIND_UNSPECIFIED = 0;
  NODE_SLOT_TRANSITION_KIND_ADDITION = 1;
  NODE_SLOT_TRANSITION_KIND_REPLACEMENT = 2;
  NODE_SLOT_TRANSITION_KIND_UNCHANGED = 3;
  NODE_SLOT_TRANSITION_KIND_REMOVAL = 4;
  NODE_SLOT_TRANSITION_KIND_RESTART = 5;
}

enum InstructionTargetKind {
  INSTRUCTION_TARGET_KIND_UNSPECIFIED = 0;
  INSTRUCTION_TARGET_KIND_PROXY = 1;
  INSTRUCTION_TARGET_KIND_ENGINE_SLOT = 2;
  INSTRUCTION_TARGET_KIND_RELEASE_CLEANUP = 3;
}

enum BackendKind {
  BACKEND_KIND_UNSPECIFIED = 0;
  BACKEND_KIND_SYSTEMD = 1;
  BACKEND_KIND_DOCKER = 2;
}

enum BackendProcessState {
  BACKEND_PROCESS_STATE_UNSPECIFIED = 0;
  BACKEND_PROCESS_STATE_RUNNING = 1;
  BACKEND_PROCESS_STATE_EXITED = 2;
  BACKEND_PROCESS_STATE_QUERY_ERROR = 3;
}

// Backend-neutral proof collected for the exact process identity pinned before
// a stop effect. UNKNOWN is deliberately fail-closed for incomplete facts.
enum BackendStopDisposition {
  BACKEND_STOP_DISPOSITION_UNKNOWN = 0;
  BACKEND_STOP_DISPOSITION_GRACEFUL = 1;
  BACKEND_STOP_DISPOSITION_FORCED = 2;
}

message BackendTerminationEvidence {
  BackendKind backend = 1;
  string backend_instance_id = 2;
  string process_instance_id = 3;
  bool graceful_termination_requested = 4;
  bool kill_escalated = 5;
  BackendStopDisposition disposition = 6;
  string terminal_result = 7;
  optional int32 exit_code = 8;
  optional int32 signal = 9;
}

message ProxyTargetIdentity {}
message EngineSlotTargetIdentity { string engine_slot = 1; }

message InstructionTarget {
  InstructionTargetKind kind = 1;
  reserved 2;
  reserved "engine_slot";
  uint64 revision = 3;
  string bundle_digest = 4;
  string resolved_release_digest = 5;
  oneof identity {
    ProxyTargetIdentity proxy = 6;
    EngineSlotTargetIdentity engine_slot_target = 7;
  }
}

message RolloutPolicy {
  reserved 2, 3;
  reserved "canary_slot", "pause_after_canary";
  uint32 max_unavailable = 1;
  bool allow_downtime = 4;
  uint64 deadline_seconds = 5;
}

message ProxyTargetDetails {}
message EngineTargetDetails {
  uint32 rollout_order = 1;
  uint64 authoritative_revision = 2;
  bool authority_switched = 3;
  bool serving_converged = 4;
}

message OperationTargetProgress {
  InstructionTargetKind kind = 1;
  oneof identity {
    ProxyTargetIdentity proxy = 2;
    EngineSlotTargetIdentity engine_slot = 3;
  }
  NodeOperationStepKind next_step = 4;
  uint32 completed_steps = 5;
  bool complete = 6;
  repeated DeploymentCondition conditions = 7;
  uint64 source_revision = 8;
  string source_digest = 9;
  string source_resolved_release_digest = 10;
  uint64 target_revision = 11;
  string target_digest = 12;
  string target_resolved_release_digest = 13;
  string pinned_backend_instance_id = 14;
  string pinned_process_instance_id = 15;
  bool changed = 16;
  optional google.protobuf.Timestamp effect_delivered_at = 17;
  bool effect_reported = 18;
  uint64 effect_observed_revision = 19;
  string effect_observed_digest = 20;
  string effect_observed_resolved_release_digest = 21;
  string effect_backend_instance_id = 22;
  string effect_process_instance_id = 23;
  string effect_condition_code = 24;
  string effect_detail = 25;
  bool effect_ambiguous = 26;
  oneof details {
    ProxyTargetDetails proxy_details = 27;
    EngineTargetDetails engine_details = 28;
  }
  NodeSlotTransitionKind transition = 29;
  BackendTerminationEvidence termination_evidence = 30;
}

message NodeOperation {
  string operation_id = 1;
  string node_id = 2;
  string request_token = 3;
  string actor = 4;
  NodeOperationAction action = 5;
  NodeOperationState state = 6;
  RolloutPolicy policy = 7;
  uint64 source_revision = 8;
  uint64 target_revision = 9;
  string bundle_digest = 10;
  reserved 11;
  reserved "slots";
  bool committed = 12;
  uint64 lease_epoch = 13;
  optional google.protobuf.Timestamp lease_expires_at = 14;
  optional google.protobuf.Timestamp created_at = 15;
  optional google.protobuf.Timestamp updated_at = 16;
  repeated DeploymentCondition conditions = 17;
  NodeOperationPhase phase = 18;
  optional google.protobuf.Timestamp forward_deadline = 19;
  bool forward_fenced = 20;
  bool restoration_requested = 21;
  string agent_instance_id = 22;
  reserved 23, 24, 25, 26, 28, 29, 31 to 49;
  reserved "cleanup_superseded_by", "cleanup_evidence", "cleanup_reported_at", "cleanup_backend_query_error", "cleanup_delivered_at";
  reserved "proxy_process_instance_id", "proxy_next_step", "proxy_source_revision", "proxy_source_digest", "proxy_source_resolved_release_digest", "proxy_target_revision", "proxy_target_digest", "proxy_target_resolved_release_digest", "proxy_backend_instance_id", "proxy_changed", "proxy_effect_ambiguous", "proxy_effect_delivered_at", "proxy_effect_reported", "proxy_effect_observed_revision", "proxy_effect_observed_digest", "proxy_effect_observed_resolved_release_digest", "proxy_effect_backend_instance_id", "proxy_effect_process_instance_id", "proxy_effect_condition_code", "proxy_effect_detail";
  NodeOperationState restoration_terminal_state = 27;
  string resolved_release_digest = 30;
  string revision_digest = 50;
  repeated OperationTargetProgress targets = 51;
}

message OperationEvent {
