syntax = "proto3";
package wruntime;

import "google/protobuf/timestamp.proto";

// ── Shared messages ───────────────────────────────────────────────────────

message ModuleDescriptor {
  string name         = 1;
  string version      = 2;
  bytes  proto_schema = 3; // serialised FileDescriptorSet for this module's API
  string namespace    = 4; // mandatory — e.g. "payments"
}

message EngineRegistration {
  string                    engine_id     = 1;
  string                    address       = 2; // HTTP URL the local proxy uses to reach this engine
  repeated ModuleDescriptor modules       = 3;
  string                    proxy_address = 4; // local proxy URL used by this engine
  repeated SecretRequest    secrets       = 5; // secrets this engine needs (resolved from config)
  string                    peer_address  = 6; // mTLS peer address (https://host:peer_port)
  repeated string           db_namespaces = 7; // namespaces that need DB access
  DeploymentMetadata        deployment    = 8; // stable desired-deployment identity
}

// Stable metadata supplied by a revision-specific engine configuration. engine_id
// remains a process identity; node_id/revision/slot identify the desired deployment.
message DeploymentMetadata {
  string node_id = 1;
  uint64 revision = 2;
  string bundle_digest = 3; // sha256:<lowercase hex>
  string engine_slot = 4;
}

message ModuleIdentity {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message ExpectedEngine {
  string engine_slot = 1;
  repeated ModuleIdentity modules = 2;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_PENDING = 1;
  DEPLOYMENT_STATE_ACTIVE = 2;
  DEPLOYMENT_STATE_SUCCEEDED = 3;
  DEPLOYMENT_STATE_FAILED = 4;
}

message DeploymentCondition {
  string code = 1; // stable machine-readable reason code
  string detail = 2; // human-readable evidence; automation must use code/severity
  StatusSeverity severity = 3;
  string affected_identity = 4;
  string desired = 5;
  string actual = 6;
}

message DeploymentRecord {
  string node_id = 1;
  uint64 revision = 2;
  string attempt_token = 3;
  string bundle_digest = 4;
  repeated ExpectedEngine expected_engines = 5;
  DeploymentState state = 6;
  optional google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  string failure_detail = 9;
  uint64 source_revision = 10; // non-zero when this attempt rolls back a prior snapshot
  optional google.protobuf.Timestamp activated_at = 11;
}

message BeginDeploymentRequest {
  string node_id = 1;
  string attempt_token = 2;
  string bundle_digest = 3;
  repeated ExpectedEngine expected_engines = 4;
}
message BeginDeploymentResponse { DeploymentRecord deployment = 1; }

message VerifyDeploymentRequest { string node_id = 1; uint64 revision = 2; }
message VerifyDeploymentResponse {
  DeploymentRecord deployment = 1;
  bool ready = 2;
  repeated DeploymentCondition conditions = 3;
}

message CompleteDeploymentRequest {
  string node_id = 1;
  uint64 revision = 2;
  bool succeeded = 3;
  string failure_detail = 4;
}
message CompleteDeploymentResponse { DeploymentRecord deployment = 1; }

message BeginRollbackRequest {
  string node_id = 1;
  uint64 to_revision = 2; // zero selects the previous successful revision
  string attempt_token = 3;
}
message BeginRollbackResponse { DeploymentRecord deployment = 1; }

message RoutingRule {
  string rule_id                   = 1;
  string source_module             = 2; // metadata reserved for future source policy; ignored by routing
  string destination_module        = 3;
  string engine_id                 = 4;
  string engine_address            = 5;
  string destination_version       = 6; // semver string, e.g. "1.2.0"
  bool   healthy                   = 7; // set by manager; false means no traffic
  string source_namespace          = 8; // metadata reserved for future source policy; ignored by routing
  string destination_namespace     = 9;
  reserved 10;
  reserved "proxy_address";
  string peer_address              = 11; // sole cross-node forwarding address (required, non-empty)
}

message RoutingTable {
  repeated RoutingRule rules   = 1;
  uint64               version = 2; // incremented on every write
}

// ── Engine lifecycle ──────────────────────────────────────────────────────

message RegisterEngineRequest    { EngineRegistration registration = 1; }
message RegisterEngineResponse   {
  bool                              accepted       = 1;
  repeated NamespaceSecrets         secrets        = 2; // only the requested secrets, decrypted
  repeated NamespaceDbCredential    db_credentials = 3; // per-namespace DB role + password
}
message DeregisterEngineRequest  { string engine_id = 1; }
message DeregisterEngineResponse {}
message HeartbeatRequest {
  string                    engine_id       = 1;
  repeated ModuleDescriptor healthy_modules = 2; // modules the engine considers healthy
}
message HeartbeatResponse        {}
message ListEnginesRequest       {}
message ListEnginesResponse      { repeated EngineRegistration engines = 1; }

// ── Routing table ─────────────────────────────────────────────────────────

message GetRoutingTableRequest    {
  uint64 known_version = 1; // if set and matches current version, server returns no table
}
message GetRoutingTableResponse   { RoutingTable table = 1; }
message UpsertRoutingRuleResponse {}
message DeleteRoutingRuleRequest  { string rule_id = 1; }
message DeleteRoutingRuleResponse {}

// ── Database credentials ──────────────────────────────────────────────────

message NamespaceDbCredential {
  string namespace = 1;
  string role      = 2;  // e.g. "wr_ns_ecommerce"
  string password  = 3;
}

// ── Secrets ───────────────────────────────────────────────────────────────

message SecretRequest {
  string namespace = 1;
  string key       = 2;
}

message NamespaceSecrets {
  string              namespace = 1;
  map<string, string> secrets   = 2; // key → plaintext value
}

message SetSecretRequest    { string namespace = 1; string key = 2; string value = 3; }
message SetSecretResponse   {}
message DeleteSecretRequest { string namespace = 1; string key = 2; }
message DeleteSecretResponse{}
message ListSecretsRequest  { string namespace = 1; } // empty = all namespaces
message SecretEntry         { string namespace = 1; string key = 2; }
message ListSecretsResponse { repeated SecretEntry secrets = 1; }

// ── Manager discovery ─────────────────────────────────────────────────────

message ListManagersRequest  {}
message ManagerInfo          { string manager_id = 1; string grpc_address = 2; string gossip_address = 3; }
message ListManagersResponse { repeated ManagerInfo managers = 1; }

// ── Explainable cluster status ────────────────────────────────────────────

// Numeric ordering is deliberate for deterministic reduction. UNKNOWN is a
// separate evidence state and is ignored when reducing supported signals.
enum StatusSeverity {
  STATUS_SEVERITY_UNKNOWN = 0;
  STATUS_SEVERITY_HEALTHY = 1;
  STATUS_SEVERITY_DEGRADED = 2;
  STATUS_SEVERITY_UNHEALTHY = 3;
}

enum ManagerMembershipState {
  MANAGER_MEMBERSHIP_STATE_UNKNOWN = 0;
  MANAGER_MEMBERSHIP_STATE_LIVE = 1;
  MANAGER_MEMBERSHIP_STATE_DEAD = 2;
}

message ManagerStatus {
  string manager_id = 1;
  string grpc_address = 2;
  string gossip_address = 3;
  StatusSeverity severity = 4;
  ManagerMembershipState membership = 5;
  optional google.protobuf.Timestamp registered_at = 6;
  optional google.protobuf.Timestamp last_heartbeat = 7;
  uint64 heartbeat_age_seconds = 8;
  repeated DeploymentCondition conditions = 9;
}

message ModuleStatus {
  ModuleIdentity module = 1;
  StatusSeverity severity = 2;
  optional google.protobuf.Timestamp last_healthy = 3;
  uint64 heartbeat_age_seconds = 4;
  repeated DeploymentCondition conditions = 5;
}

message EngineStatus {
  string engine_id = 1;
  string address = 2;
  DeploymentMetadata deployment = 3;
  StatusSeverity severity = 4;
  bool authoritative_for_desired_revision = 5;
  optional google.protobuf.Timestamp registered_at = 6;
  optional google.protobuf.Timestamp last_heartbeat = 7;
  uint64 heartbeat_age_seconds = 8;
  repeated ModuleStatus modules = 9;
  repeated DeploymentCondition conditions = 10;
}

message RouteStatus {
  RoutingRule rule = 1;
  StatusSeverity severity = 2;
  bool desired = 3;
  optional google.protobuf.Timestamp updated_at = 4;
  repeated DeploymentCondition conditions = 5;
}

message ServiceStatus {
  ModuleIdentity service = 1;
  StatusSeverity severity = 2;
  uint32 desired_routes = 3;
  uint32 healthy_routes = 4;
  uint32 unhealthy_routes = 5;
  repeated RouteStatus routes = 6;
  repeated DeploymentCondition conditions = 7;
}

message NodeStatus {
  string node_id = 1;
  StatusSeverity severity = 2;
  DeploymentRecord desired_deployment = 3;
  repeated DeploymentRecord deployment_history = 4;
  repeated EngineStatus engines = 5;
  repeated DeploymentCondition conditions = 6;
}

message GetClusterStatusRequest {}
message GetClusterStatusResponse {
  optional google.protobuf.Timestamp response_at = 1;
  optional google.protobuf.Timestamp database_observed_at = 2;
  optional google.protobuf.Timestamp gossip_observed_at = 3;
  uint64 routing_table_version = 4;
  StatusSeverity severity = 5;
  repeated ManagerStatus managers = 6;
  repeated NodeStatus nodes = 7;
  repeated EngineStatus engines = 8; // includes managed and unmanaged registrations
  repeated ServiceStatus services = 9;
  repeated DeploymentCondition conditions = 10; // cluster-wide/unsupported signals
}

// ── Schemas ───────────────────────────────────────────────────────────────

message GetSchemaRequest    { string module = 1; string version = 2; string namespace = 3; }
message GetSchemaResponse   { bytes proto_schema = 1; }

// ── Worker job queue ──────────────────────────────────────────────────────

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING     = 1;
  JOB_STATE_RUNNING     = 2;
  JOB_STATE_COMPLETE    = 3;
  JOB_STATE_DEAD        = 4;
}

message SubmitJobRequest {
  // Namespace/name must match the proxy-routed worker identity.
  string worker_namespace = 1;
  string worker_name      = 2;
  // Optional. Empty means name-only dispatch; non-empty pins the exact version.
  string worker_version   = 3;
  string job_type         = 4;
  bytes  payload          = 5;
  uint32 timeout_secs     = 6; // 0 uses the configured default
  uint32 max_attempts     = 7; // 0 uses the configured default
}

message SubmitJobResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id        = 1;
  JobState status      = 2;
  bytes  result        = 3;
  string error_message = 4;
  uint32 attempt       = 5;
  uint32 max_attempts  = 6;
}

// ── Schedules ────────────────────────────────────────────────────────────

message Schedule {
  string schedule_id       = 1;
  string worker_namespace  = 2;
  string worker_name       = 3;
  string worker_version    = 4;
  string job_type          = 5;
  uint32 interval_secs     = 6;
  bool   immediate         = 7;
  bytes  payload           = 8;
  uint32 timeout_secs      = 9;
  uint32 max_attempts      = 10;
  bool   enabled           = 11;
  optional google.protobuf.Timestamp last_fired_at = 12;
  optional google.protobuf.Timestamp next_fire_at = 13;
  string last_error           = 14;
  uint32 consecutive_failures = 15;
}

message UpsertScheduleRequest {
  string worker_namespace  = 1;
  string worker_name       = 2;
  string worker_version    = 3;
  string job_type          = 4;
  uint32 interval_secs     = 5;
  bool   immediate         = 6;
  bytes  payload           = 7;
  uint32 timeout_secs      = 8;
  uint32 max_attempts      = 9;
}

message UpsertScheduleResponse { string schedule_id = 1; }

message DeleteScheduleRequest {
  string worker_namespace = 1;
  string worker_name      = 2;
  string worker_version   = 3;
  string job_type         = 4;
}

message DeleteScheduleResponse {}

message ListSchedulesRequest  { string worker_namespace = 1; }
message ListSchedulesResponse { repeated Schedule schedules = 1; }

// ── NodeService ──────────────────────────────────────────────────────────
// Local gRPC service exposed by wr-proxy for engines on the same node.
// Engines use this instead of connecting directly to wr-manager.

service NodeService {
  rpc RegisterEngine   (RegisterEngineRequest)   returns (RegisterEngineResponse);
  rpc DeregisterEngine (DeregisterEngineRequest)  returns (DeregisterEngineResponse);
  rpc Heartbeat        (HeartbeatRequest)          returns (HeartbeatResponse);
}

// ── ManagerService ────────────────────────────────────────────────────────

service ManagerService {
  // Engine lifecycle
  rpc RegisterEngine    (RegisterEngineRequest)    returns (RegisterEngineResponse);
  rpc DeregisterEngine  (DeregisterEngineRequest)  returns (DeregisterEngineResponse);
  rpc Heartbeat         (HeartbeatRequest)         returns (HeartbeatResponse);
  rpc ListEngines       (ListEnginesRequest)       returns (ListEnginesResponse);

  // Routing table
  rpc GetRoutingTable   (GetRoutingTableRequest)   returns (GetRoutingTableResponse);
  rpc UpsertRoutingRule (RoutingRule)              returns (UpsertRoutingRuleResponse);
  rpc DeleteRoutingRule (DeleteRoutingRuleRequest) returns (DeleteRoutingRuleResponse);

  // Manager discovery and coherent read-only cluster status
  rpc ListManagers      (ListManagersRequest)      returns (ListManagersResponse);
  rpc GetClusterStatus  (GetClusterStatusRequest)  returns (GetClusterStatusResponse);

  // Schemas
  rpc GetSchema         (GetSchemaRequest)         returns (GetSchemaResponse);

  // Secrets
  rpc SetSecret         (SetSecretRequest)         returns (SetSecretResponse);
  rpc DeleteSecret      (DeleteSecretRequest)      returns (DeleteSecretResponse);
  rpc ListSecrets       (ListSecretsRequest)       returns (ListSecretsResponse);

  // Schedules
  rpc UpsertSchedule    (UpsertScheduleRequest)    returns (UpsertScheduleResponse);
  rpc DeleteSchedule    (DeleteScheduleRequest)    returns (DeleteScheduleResponse);
  rpc ListSchedules     (ListSchedulesRequest)     returns (ListSchedulesResponse);

  // Desired deployment lifecycle. Engines continue to use NodeService and only
  // report their activated metadata through RegisterEngine.
  rpc BeginDeployment   (BeginDeploymentRequest)   returns (BeginDeploymentResponse);
  rpc VerifyDeployment  (VerifyDeploymentRequest)  returns (VerifyDeploymentResponse);
  rpc CompleteDeployment(CompleteDeploymentRequest) returns (CompleteDeploymentResponse);
  rpc BeginRollback     (BeginRollbackRequest)     returns (BeginRollbackResponse);
}
