// These operation messages are hosted by the manager-listener domain services
// declared below. Service boundaries are intentionally distinct from process
// implementation types.

// ── Schemas ───────────────────────────────────────────────────────────────

message GetSchemaRequest    { string module = 1; string version = 2; string namespace = 3; }
message GetSchemaResponse   { bytes proto_schema = 1; }

// ── Worker job queue ──────────────────────────────────────────────────────

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING     = 1;
  JOB_STATE_RUNNING     = 2;
  JOB_STATE_COMPLETE    = 3;
  JOB_STATE_DEAD        = 4;
}

message SubmitJobRequest {
  // Namespace/name must match the proxy-routed worker identity.
  string worker_namespace = 1;
  string worker_name      = 2;
  // Optional. Empty means name-only dispatch; non-empty pins the exact version.
  string worker_version   = 3;
  string job_type         = 4;
  bytes  payload          = 5;
  uint32 timeout_secs     = 6; // 0 uses the configured default
  uint32 max_attempts     = 7; // 0 uses the configured default
}

message SubmitJobResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id        = 1;
  JobState status      = 2;
  bytes  result        = 3;
  string error_message = 4;
  uint32 attempt       = 5;
  uint32 max_attempts  = 6;
}

// ── Trusted job administration ───────────────────────────────────────────

message JobFilter {
  string worker_namespace = 1;
  string worker_name = 2;
  string worker_version = 3;
  string job_type = 4;
  string source_namespace = 5;
  string source_module = 6;
  optional google.protobuf.Timestamp created_at_from = 7; // inclusive
  optional google.protobuf.Timestamp created_at_before = 8; // exclusive
}

message JobSummary {
  string job_id = 1;
  string worker_namespace = 2;
  string worker_name = 3;
  string worker_version = 4;
  string job_type = 5;
  JobState status = 6;
  uint32 attempt = 7;
  uint32 max_attempts = 8;
  string source_namespace = 9;
  string source_module = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message JobDetail {
  string job_id = 1;
  string worker_namespace = 2;
  string worker_name = 3;
  string worker_version = 4;
  string job_type = 5;
  JobState status = 6;
  bytes payload = 7;
  bytes result = 8;
  string last_error = 9;
  uint32 attempt = 10;
  uint32 max_attempts = 11;
  uint32 timeout_secs = 12;
  string source_namespace = 13;
  string source_module = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional google.protobuf.Timestamp claimed_at = 17;
  optional google.protobuf.Timestamp lease_expires_at = 18;
  optional google.protobuf.Timestamp completed_at = 19;
  string claimed_by = 20;
}

message ListJobQueuesRequest {}

enum JobQueueAvailability {
  JOB_QUEUE_AVAILABILITY_UNSPECIFIED = 0;
  JOB_QUEUE_AVAILABILITY_AVAILABLE = 1;
  JOB_QUEUE_AVAILABILITY_UNAVAILABLE = 2;
}

message JobQueueInfo {
  string job_queue_id = 1;
  JobQueueAvailability availability = 2;
  uint32 fresh_delegates = 3;
  uint32 total_delegates = 4;
}
message ListJobQueuesResponse { repeated JobQueueInfo queues = 1; }

message ListJobsRequest {
  string job_queue_id = 1;
  JobFilter filter = 2;
  optional JobState status = 3;
  uint32 page_size = 4; // zero selects the server default of 50
  string cursor = 5;
}
message ListJobsResponse {
  repeated JobSummary jobs = 1;
  string next_cursor = 2;
}

message GetJobQueueSummaryRequest {
  string job_queue_id = 1;
  JobFilter filter = 2;
}
message JobQueueSummary {
  google.protobuf.Timestamp observed_at = 1;
  uint64 pending = 2;
  uint64 running = 3;
  uint64 complete = 4;
  uint64 dead = 5;
  uint64 total = 6;
  uint64 depth = 7;
  optional google.protobuf.Timestamp oldest_pending_at = 8;
}
message GetJobQueueSummaryResponse { JobQueueSummary summary = 1; }

message GetJobRequest {
  string job_queue_id = 1;
  string job_id = 2;
}
message GetJobResponse { JobDetail job = 1; }

message RetryJobRequest {
  string job_queue_id = 1;
  string job_id = 2;
}
message RetryJobResponse { JobDetail job = 1; }

message CheckJobQueueRequest { string job_queue_id = 1; }
message CheckJobQueueResponse { bool ready = 1; }

// Manager-listener job administration domain.
service JobService {
  rpc ListJobQueues(ListJobQueuesRequest) returns (ListJobQueuesResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJobQueueSummary(GetJobQueueSummaryRequest) returns (GetJobQueueSummaryResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
}

// Manager-workload service hosted by database-enabled engines. Stock TLS
// verifies the explicit client root; leaf policy admits enrolled manager URI
// principals with the clientAuth profile.
service EngineJobAdminService {
  rpc CheckJobQueue(CheckJobQueueRequest) returns (CheckJobQueueResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJobQueueSummary(GetJobQueueSummaryRequest) returns (GetJobQueueSummaryResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
}

// ── Schedules ────────────────────────────────────────────────────────────

message Schedule {
  string schedule_id       = 1;
  string worker_namespace  = 2;
  string worker_name       = 3;
  string worker_version    = 4;
  string job_type          = 5;
  uint32 interval_secs     = 6;
  bool   immediate         = 7;
  bytes  payload           = 8;
  uint32 timeout_secs      = 9;
  uint32 max_attempts      = 10;
  bool   enabled           = 11;
  optional google.protobuf.Timestamp last_fired_at = 12;
  optional google.protobuf.Timestamp next_fire_at = 13;
  string last_error           = 14;
  uint32 consecutive_failures = 15;
}

message UpsertScheduleRequest {
  string worker_namespace  = 1;
  string worker_name       = 2;
  string worker_version    = 3;
  string job_type          = 4;
  uint32 interval_secs     = 5;
  bool   immediate         = 6;
  bytes  payload           = 7;
  uint32 timeout_secs      = 8;
  uint32 max_attempts      = 9;
}

message UpsertScheduleResponse { string schedule_id = 1; }

message DeleteScheduleRequest {
  string worker_namespace = 1;
  string worker_name      = 2;
  string worker_version   = 3;
  string job_type         = 4;
}

message DeleteScheduleResponse {}

message ListSchedulesRequest  { string worker_namespace = 1; }
message ListSchedulesResponse { repeated Schedule schedules = 1; }

// ── Manager-set rollout creation and observation ─────────────────────────

enum ManagerRolloutPhase {
  MANAGER_ROLLOUT_PHASE_UNSPECIFIED = 0;
  MANAGER_ROLLOUT_PHASE_PREPARED = 1;
  MANAGER_ROLLOUT_PHASE_STAGING = 2;
  MANAGER_ROLLOUT_PHASE_CLOSING_OLD = 3;
  MANAGER_ROLLOUT_PHASE_OLD_CLOSED = 4;
  MANAGER_ROLLOUT_PHASE_STARTING_TARGET = 5;
  MANAGER_ROLLOUT_PHASE_TARGET_READY_CLOSED = 6;
  MANAGER_ROLLOUT_PHASE_ACTIVATING_TARGET = 7;
  MANAGER_ROLLOUT_PHASE_COMPLETED = 8;
  MANAGER_ROLLOUT_PHASE_FAILED_PRE_CLOSE = 9;
  MANAGER_ROLLOUT_PHASE_FAILED_CLOSED = 10;
}

message ManagerRolloutSource {
  string manager_id = 1;
  string endpoint = 2;
  string host_digest = 3;
  string selector_digest = 4;
}

message ManagerRolloutTarget {
  string manager_id = 1;
  string endpoint = 2;
  string host_digest = 3;
  string config_digest = 4;
  string backend = 5;
  string executable_digest = 6;
  string backend_spec_digest = 7;
  string credential_digest = 8;
  string old_selector_digest = 9;
  string new_selector_digest = 10;
}

message BeginManagerRolloutRequest {
  string client_operation_id = 1; // required bounded caller UUID
  string cluster_id = 2;
  uint64 target_generation = 3;
  string target_policy_digest = 4;
  repeated ManagerRolloutTarget expected_targets = 5;
  string recovery_of = 6; // optional predecessor rollout UUID
  uint32 target_policy_validator_version = 7;
  string target_deployment_principal_uri = 8;
  string target_deployment_leaf_fingerprint = 9;
  repeated ManagerRolloutSource source_managers = 10;
  string manifest_digest = 11;
  string executor_id = 12;
  string deployment_certificate = 13;
}

message ManagerRollout {
  string rollout_id = 1;
  string deployment_principal_uri = 2;
  string client_operation_id = 3;
  string request_digest = 4;
  string cluster_id = 5;
  uint64 target_generation = 6;
  string target_policy_digest = 7;
  repeated ManagerRolloutTarget expected_targets = 8;
  string recovery_of = 9;
  ManagerRolloutPhase phase = 10;
  string executor_id = 11;
  uint64 lease_epoch = 12;
  optional google.protobuf.Timestamp lease_expires_at = 13;
  uint32 target_policy_validator_version = 14;
  string target_deployment_principal_uri = 15;
  string target_deployment_leaf_fingerprint = 16;
  string expected_target_set_hash = 17;
  string failure = 18;
  repeated ManagerRolloutSource source_managers = 19;
  string manifest_digest = 20;
  string executor_id_from_manifest = 21;
  string deployment_certificate = 22;
}
message BeginManagerRolloutResponse { ManagerRollout rollout = 1; }
message LeaseManagerRolloutRequest {
  string rollout_id = 1;
  string executor_id = 2;
  uint64 expected_lease_epoch = 3;
}
message LeaseManagerRolloutResponse { ManagerRollout rollout = 1; }
message ManagerRolloutMemberOutcome {
  string manager_id = 1;
  string member_role = 2;
  string host_action_outcome = 3;
  string error = 4;
}
message AdvanceManagerRolloutRequest {
  string rollout_id = 1;
  string executor_id = 2;
  uint64 lease_epoch = 3;
  ManagerRolloutPhase expected_phase = 4;
  ManagerRolloutPhase next_phase = 5;
  repeated ManagerRolloutMemberOutcome member_outcomes = 6;
}
message AdvanceManagerRolloutResponse { ManagerRollout rollout = 1; }
message GetManagerRolloutRequest { string rollout_id = 1; }
message GetManagerRolloutResponse { ManagerRollout rollout = 1; }

message GetPolicyStatusRequest {}
message PolicyCapHeadroom {
  uint64 raw_bytes = 1;
  uint64 canonical_bytes = 2;
  uint64 principals = 3;
  uint64 assignments = 4;
  uint64 scope_values = 5;
  uint64 managers = 6;
  uint64 proxies = 7;
  uint64 node_agents = 8;
  uint64 revoked_fingerprints = 9;
}
message GetPolicyStatusResponse {
  uint64 generation = 1;
  string digest = 2;
  string admission = 3;
  uint32 schema_version = 4;
  uint32 validator_version = 5;
  PolicyCapHeadroom cap_headroom = 6;
}
enum WorkloadProjectionKind {
  WORKLOAD_PROJECTION_KIND_UNSPECIFIED = 0;
  WORKLOAD_PROJECTION_KIND_PROXY_PEER_V1 = 1;
  WORKLOAD_PROJECTION_KIND_ENGINE_JOB_ADMIN_V1 = 2;
}
message WorkloadEnrollmentV1 {
  string principal_uri = 1;
  string workload_id = 2;
}
message WorkloadSnapshotV1 {
  uint32 schema_version = 1;
  WorkloadProjectionKind projection_kind = 2;
  string cluster_id = 3;
  uint64 policy_generation = 4;
  string policy_digest = 5;
  string projection_digest = 6;
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp valid_until = 8;
  uint32 enrollment_count = 9;
  uint32 revoked_fingerprint_count = 10;
  repeated WorkloadEnrollmentV1 enrollments = 11;
