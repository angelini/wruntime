manager_id                    = "manager-a"
listen_address                = "0.0.0.0:9000"
engine_heartbeat_timeout_secs = 30
local_proxy_address           = "http://127.0.0.1:9001"
release_cleanup_interval_secs = 30

[tls]
cert_path           = "certs/runtime-manager-endpoint/leaf.pem"
key_path            = "certs/runtime-manager-endpoint/key.pem"
client_ca_cert_path = "certs/runtime-client-root/ca.crt"

# Distinct manager workload identity for authenticated manager-originated calls.
[client_tls]
cert_path           = "certs/runtime-manager-client/leaf.pem"
key_path            = "certs/runtime-manager-client/key.pem"
server_ca_cert_path = "certs/runtime-server-root/ca.crt"

[authorization]
policy_file = "policy/authorization.toml"

[database]
url             = "postgres://postgres@localhost:5433/wruntime_example"
max_connections = 10

[cluster]
manager_heartbeat_interval_secs       = 1
manager_liveness_threshold_secs       = 5
manager_stale_row_reap_threshold_secs = 300
