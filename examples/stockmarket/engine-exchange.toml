listen_address = "127.0.0.1:9100"

[node]
proxy_address   = "http://127.0.0.1:9001"
control_address = "http://127.0.0.1:9002"
peer_address    = "https://127.0.0.1:9443"

[node.tls]
cert_path    = "certs/127.0.0.1.crt"
key_path     = "certs/127.0.0.1.key"
ca_cert_path = "certs/ca.crt"

[database]
url             = "postgres://user:pass@localhost:5432/stockmarket"
max_connections = 100

[job_admin]
listen_address    = "127.0.0.1:9150"
advertise_address = "https://127.0.0.1:9150"
queue_id          = "stockmarket-jobs"

[job_admin.tls]
cert_path    = "certs/job-admin-delegation/127.0.0.1.crt"
key_path     = "certs/job-admin-delegation/127.0.0.1.key"
ca_cert_path = "certs/job-admin-delegation/ca.crt"

[[module]]
name            = "exchange"
namespace       = "stockmarket"
version         = "1.0.0"
wasm_path       = "examples/stockmarket/exchange/target/wasm32-wasip2/debug/exchange.wasm"
schema_path     = "examples/stockmarket/schemas/exchange.binpb"
database        = true
migrations_path = "examples/stockmarket/exchange/migrations"

[[module]]
name            = "exchange"
namespace       = "stockmarket"
version         = "1.0.0"
wasm_path       = "examples/stockmarket/exchange/target/wasm32-wasip2/debug/exchange.wasm"
database        = true
migrations_path = "examples/stockmarket/exchange/migrations"

[[module]]
name            = "exchange"
namespace       = "stockmarket"
version         = "1.0.0"
wasm_path       = "examples/stockmarket/exchange/target/wasm32-wasip2/debug/exchange.wasm"
database        = true
migrations_path = "examples/stockmarket/exchange/migrations"
