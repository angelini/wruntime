listen_address = "127.0.0.1:9101"

[node]
proxy_address   = "http://127.0.0.1:9001"
control_address = "http://127.0.0.1:9002"
peer_address    = "https://127.0.0.1:9443"

[database]
url             = "postgres://postgres@localhost:5433/wruntime_example"
max_connections = 100

[job_admin]
listen_address    = "127.0.0.1:9151"
advertise_address = "https://127.0.0.1:9151/"
queue_id          = "ecommerce-jobs"

[job_admin.tls]
cert_path           = "certs/job-admin-engine-endpoint/leaf.pem"
key_path            = "certs/job-admin-engine-endpoint/key.pem"
client_ca_cert_path = "certs/runtime-client-root/ca.crt"

[[module]]
name            = "inventory"
namespace       = "ecommerce"
version         = "1.0.0"
wasm_path       = "examples/ecommerce/inventory/target/wasm32-wasip2/debug/inventory.wasm"
schema_path     = "examples/ecommerce/schemas/inventory.binpb"
database        = true
migrations_path = "examples/ecommerce/inventory/migrations"
